      <path d="M76 100 366 28l266 133-290 72L76 100Z" fill="#D2DCE1"/>
      <path d="M76 100 366 28l266 133-290 72L76 100Z" fill="url(#cardFace)"/>
      <g clip-path="url(#clipTwo)">
        <path d="M44 60h300v230H44z" fill="url(#photoTwo)"/>
        <path d="m48 200 68-77 51 52 73-89 89 130H48Z" fill="#1D4051" opacity=".8"/>
        <path d="m67 80 188 46v60L67 139V80Z" fill="#123249"/>
        <path d="m87 95 139 34m-136-19 133 32m-129-17 128 30" stroke="#7DCDD2" stroke-width="4"/>
        <path d="M138 173c4-27 17-42 36-42 20 0 34 15 39 43l-75-1Z" fill="#D4E2E1"/>
        <path d="M126 183c-20 9-34 21-41 40h143c-6-17-20-30-43-40" fill="#435D69"/>
        <path d="m326 95 279 71-279 70-24-8 275-68-253-64Z" fill="#fff" opacity=".96"/>
