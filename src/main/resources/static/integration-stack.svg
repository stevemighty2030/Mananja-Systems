  <!-- Floating labels identify each layer while preserving the open, airy reference style. -->
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">
    <g transform="translate(90 255) rotate(-9)">
      <rect width="205" height="36" rx="18" fill="#fff" stroke="#E1E8EC"/>
      <circle cx="19" cy="18" r="5" fill="#52A9BC"/>
      <text x="34" y="23" fill="#52657B" font-size="10">EVENT STREAMING</text>
    </g>
    <g transform="translate(404 454) rotate(-9)">
      <rect width="205" height="36" rx="18" fill="#fff" stroke="#E1E8EC"/>
      <circle cx="19" cy="18" r="5" fill="#DF3D35"/>
      <text x="34" y="23" fill="#52657B" font-size="10">DEVOPS &amp; CI/CD</text>
    </g>
    <g transform="translate(116 589) rotate(-9)">
      <rect width="180" height="36" rx="18" fill="#fff" stroke="#E1E8EC"/>
      <circle cx="19" cy="18" r="5" fill="#52A9BC"/>
      <text x="34" y="23" fill="#52657B" font-size="10">IDENTITY &amp; ACCESS</text>
    </g>
  </g>

  <g transform="translate(392 731)">
    <rect width="246" height="39" rx="19.5" fill="#fff" stroke="#E0E8EC"/>
    <circle cx="20" cy="19.5" r="5" fill="#DF3D35"/>
    <text x="37" y="24" fill="#52657B" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">ONE CONNECTED SYSTEM</text>
  </g>
</svg>
