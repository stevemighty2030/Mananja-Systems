        <path d="m83 112 95-24m-94 35 75-18m-76 31 105-26" stroke="#5ED4D1" stroke-width="3" opacity=".8"/>
        <circle cx="170" cy="166" r="30" fill="#C6DADB" opacity=".8"/>
        <path d="M129 235c5-33 21-52 43-52s39 18 44 52" fill="#344F5D"/>
        <path d="M330 99 608 169l-283 70-20-7 282-69-257-65Z" fill="#fff" opacity=".94"/>
