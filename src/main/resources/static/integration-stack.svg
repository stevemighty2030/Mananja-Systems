      </g>
      <path d="M76 100 366 28l266 133-290 72L76 100Z" stroke="#fff" stroke-width="4"/>
      <path d="m82 101 287-71 7 3-287 72-7-4Z" fill="#DF3D35"/>
      <circle cx="190" cy="115" r="29" fill="#FBE9E7"/>
