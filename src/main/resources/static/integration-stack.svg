        <path d="M83 80h209l19 10-210 52-18-62Z" fill="#E8F1F0"/>
        <path d="m96 88 182 45v57L96 145V88Z" fill="#294657"/>
        <path d="m121 103 129 32m-126-17 125 31m-121-16 117 30" stroke="#8DC4C6" stroke-width="4"/>
        <path d="M128 186c2-27 15-43 35-43 21 0 35 17 37 45l-72-2Z" fill="#C5D8D8"/>
        <path d="M126 183c-20 9-33 22-40 39h137c-7-18-19-30-41-39" fill="#405B65"/>
        <path d="m326 96 281 71-281 70-22-8 276-68-257-65Z" fill="#fff" opacity=".95"/>
      </g>
      <path d="M76 100 366 28l266 133-290 72L76 100Z" stroke="#fff" stroke-width="4"/>
    </g>

    <g transform="translate(0 250) rotate(-9 350 130)">
      <path d="M76 100 366 28l266 133-290 72L76 100Z" fill="#D2DCE1"/>
      <path d="M76 100 366 28l266 133-290 72L76 100Z" fill="url(#cardFace)"/>
      <g clip-path="url(#clipThree)">
        <path d="M44 60h300v230H44z" fill="url(#photoThree)"/>
        <path d="M42 199c54-74 111-84 167-40 33 26 65 33 103 6l42 86H42v-52Z" fill="#253D50" opacity=".9"/>
        <path d="M74 73h201v73L74 96V73Z" fill="#C9DDE0"/>
        <path d="m91 81 173 40v54L91 135V81Z" fill="#132D41"/>
        <path d="m112 99 125 29m-122-14 120 29m-116-14 115 27" stroke="#65B7C7" stroke-width="4"/>
        <path d="M170 177c7-21 21-32 39-32 19 0 32 13 38 34l-77-2Z" fill="#E1E8E6"/>
