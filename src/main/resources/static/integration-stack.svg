      </g>
      <text x="235" y="104" fill="#8795A6" font-size="11" font-weight="700" letter-spacing="1.7">CONNECT</text>
      <text x="235" y="132" fill="#142544" font-size="22" font-weight="700">API Management</text>
      <circle cx="592" cy="127" r="7" fill="#DF3D35"/>
