<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Connected integration platforms</title>
  <desc id="desc">A stack of illustrated platform cards representing APIs, event streaming, DevOps, identity, and microservices working together.</desc>
  <defs>
    <linearGradient id="backdrop" x1="90" y1="70" x2="650" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFC"/>
      <stop offset="1" stop-color="#EDF3F6"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="180" y1="45" x2="600" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F9FB"/>
    </linearGradient>
    <linearGradient id="photoOne" x1="70" y1="50" x2="360" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A5362"/>
      <stop offset=".5" stop-color="#56A9B6"/>
      <stop offset="1" stop-color="#D6E2E4"/>
    </linearGradient>
    <linearGradient id="photoTwo" x1="20" y1="0" x2="370" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9E9E9"/>
      <stop offset=".52" stop-color="#5792A4"/>
      <stop offset="1" stop-color="#233C55"/>
    </linearGradient>
    <linearGradient id="photoThree" x1="15" y1="20" x2="380" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19374F"/>
      <stop offset=".55" stop-color="#7196A5"/>
      <stop offset="1" stop-color="#DBE5E6"/>
    </linearGradient>
    <linearGradient id="photoFour" x1="50" y1="5" x2="390" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCE9E8"/>
      <stop offset=".48" stop-color="#7BA8A8"/>
      <stop offset="1" stop-color="#253E50"/>
    </linearGradient>
    <linearGradient id="photoFive" x1="35" y1="20" x2="390" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#193A4C"/>
      <stop offset=".5" stop-color="#4C8995"/>
      <stop offset="1" stop-color="#DAE4E6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#17334A" flood-opacity=".18"/>
    </filter>
    <filter id="softGlow" x="60" y="40" width="650" height="720" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="clipOne" clipPathUnits="userSpaceOnUse"><path d="M76 100 366 28l266 133-290 72L76 100Z"/></clipPath>
    <clipPath id="clipTwo" clipPathUnits="userSpaceOnUse"><path d="M76 100 366 28l266 133-290 72L76 100Z"/></clipPath>
    <clipPath id="clipThree" clipPathUnits="userSpaceOnUse"><path d="M76 100 366 28l266 133-290 72L76 100Z"/></clipPath>
    <clipPath id="clipFour" clipPathUnits="userSpaceOnUse"><path d="M76 100 366 28l266 133-290 72L76 100Z"/></clipPath>
    <clipPath id="clipFive" clipPathUnits="userSpaceOnUse"><path d="M76 100 366 28l266 133-290 72L76 100Z"/></clipPath>
  </defs>

  <ellipse cx="390" cy="414" rx="312" ry="330" fill="url(#backdrop)"/>
  <ellipse cx="390" cy="428" rx="270" ry="250" fill="#DCE8EC" opacity=".65" filter="url(#softGlow)"/>

