      <path d="m82 101 287-71 7 3-287 72-7-4Z" fill="#68B8C5"/>
    </g>

    <!-- Front card: API management, with a branded red capability mark. -->
    <g transform="translate(0 0) rotate(-9 350 130)">
      <path d="M76 100 366 28l266 133-290 72L76 100Z" fill="#CDD8DE"/>
      <path d="M76 100 366 28l266 133-290 72L76 100Z" fill="url(#cardFace)"/>
      <g clip-path="url(#clipOne)">
        <path d="M44 60h300v230H44z" fill="url(#photoOne)"/>
        <path d="m39 203 82-91 68 53 61-77 106 142H39v-27Z" fill="#164254" opacity=".88"/>
        <path d="m62 75 190 47v60L62 135V75Z" fill="#092B3A"/>
        <path d="m83 92 142 35m-139-20 137 33m-133-18 131 31" stroke="#67C7CC" stroke-width="4"/>
        <path d="M125 158c5-26 19-40 39-40 21 0 35 15 40 43l-79-3Z" fill="#D7E1DE"/>
        <path d="M111 171c-21 9-36 24-43 47h155c-6-21-21-35-44-45" fill="#405B61"/>
